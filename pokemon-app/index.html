
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Search App</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Pokemon Search App</h1>
        <p>Search for your favorite Pokemon!</p>
    </header>

    <main>
        <section>
            <h2>Find a Pokemon</h2>

            <label for="pokemonName">Pokemon Name:</label>
            <input type="text" id="pokemonName"
                   placeholder="Enter Pokemon name">

            <button onclick="fetchData()">Search</button>

            <p id="message"></p>

            <img id="pokemonSprite"
                 alt="Pokemon Sprite"
                 style="display: none;">

            <div id="pokemonInfo"></div>
        </section>
    </main>

    <footer>
        <p>Pokemon Search App | MI 349</p>
    </footer>
</body>
</html>
